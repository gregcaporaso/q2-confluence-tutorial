# What the tutorial needs on top of the QIIME 2 2026.10 distribution
# installed as https://install.qiime2.org says (the rachis-qiime2-2026.10
# environment): sylph (the sylph plugin runs it) and the two plugins the
# tutorial uses, installed from GitHub (main; the pins were dropped on
# 2026-10-28 as the interfaces stabilized). Applied with
# `conda env update -n rachis-qiime2-2026.10 --file <this file>` (README,
# "Create the environment").
# Both plugin repositories are private at the time of writing, so the pip
# installs below need GitHub credentials until they are made public.
channels:
- conda-forge
- bioconda
dependencies:
  - sylph=1.0.0
  - pip
  - pip:
    - q2-confluence@git+https://github.com/gregcaporaso/q2-confluence
    - mosh-sylph@git+https://github.com/gregcaporaso/mosh-sylph
